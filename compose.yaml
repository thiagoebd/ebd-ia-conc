# ============================================================
# EBD.ia — Docker Compose
# Stage atual: Fase 0.5 + Fase 1 inicial
#   - postgres + redis (Fase 0.5)
#   - mcp-oracle (Fase 1)
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL 16 — sessões, auditoria, logs de tool_use
  # ----------------------------------------------------------
  postgres:
    image: postgres:16.6-alpine
    container_name: ebdia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LANG: pt_BR.UTF-8
      LC_ALL: pt_BR.UTF-8
      PGTZ: America/Sao_Paulo
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /data/postgres:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - ebdia_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ----------------------------------------------------------
  # Redis 7 — fila, cache, idempotência, cache PCLIB
  # ----------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: ebdia_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - /data/redis:/data
    networks:
      - ebdia_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"



  # ----------------------------------------------------------
  # MCP NBS — leitura read-only do NBS (Oracle, concessionaria BMW)
  # ----------------------------------------------------------
  mcp-nbs:
    build:
      context: ./mcps/nbs
      dockerfile: Dockerfile
    image: conc/mcp-nbs:0.1.0
    container_name: conc_mcp_nbs
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NBS_USER: ${NBS_USER}
      NBS_PASSWORD: ${NBS_PASSWORD}
      NBS_DSN: ${NBS_DSN}
      NBS_POOL_MIN: ${NBS_POOL_MIN:-2}
      NBS_POOL_MAX: ${NBS_POOL_MAX:-10}
      NBS_QUERY_TIMEOUT_MS: ${NBS_QUERY_TIMEOUT_MS:-30000}
      NBS_DEFAULT_ROW_LIMIT: ${NBS_DEFAULT_ROW_LIMIT:-10000}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: America/Sao_Paulo
      MCP_NBS_TOKEN: ${MCP_NBS_TOKEN}
      MCP_NBS_LOG_DIR: /app/logs/mcp-nbs
    volumes:
      - ./logs/mcp-nbs:/app/logs/mcp-nbs
    ports:
      - "127.0.0.1:8990:8990"
    networks:
      - ebdia_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8990/health', timeout=12)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"


  # ----------------------------------------------------------
  # MCP DealerNet — leitura read-only do DealerNet Workflow (SQL Server)
  # 30 concessionarias: Toyota, Fiat, Jeep, Hyundai, Ford, Leapmotor
  # ----------------------------------------------------------
  mcp-dealernet:
    build:
      context: ./mcps/dealernet
      dockerfile: Dockerfile
    image: conc/mcp-dealernet:0.1.0
    container_name: conc_mcp_dealernet
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DN_USER: ${DN_USER}
      DN_PASSWORD: ${DN_PASSWORD}
      DN_DSN: ${DN_DSN}
      DN_POOL_MIN: ${DN_POOL_MIN:-2}
      DN_POOL_MAX: ${DN_POOL_MAX:-10}
      DN_QUERY_TIMEOUT_MS: ${DN_QUERY_TIMEOUT_MS:-30000}
      DN_DEFAULT_ROW_LIMIT: ${DN_DEFAULT_ROW_LIMIT:-1000}
      SCOPE_SHADOW: ${SCOPE_SHADOW:-0}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: America/Sao_Paulo
      MCP_DN_TOKEN: ${MCP_DN_TOKEN}
      MCP_DN_LOG_DIR: /app/logs/mcp-dealernet
    volumes:
      - ./logs/mcp-dealernet:/app/logs/mcp-dealernet
    ports:
      - "127.0.0.1:8991:8991"
    networks:
      - ebdia_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8991/health', timeout=12)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

# ============================================================
# Rede interna do EBD.ia
# Containers se enxergam pelos nomes (postgres, redis, mcp-oracle)
# ============================================================
networks:
  ebdia_net:
    name: ebdia_net
    driver: bridge
